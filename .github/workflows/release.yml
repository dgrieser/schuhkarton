name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      # The Linux binaries embed a static heif-dec (internal/gallery/heifdec;
      # the files in the repository are empty).
      - name: Build static heif-dec
        run: |
          docker buildx build --output type=local,dest=internal/gallery/heifdec deploy/heif-dec
          git update-index --assume-unchanged internal/gallery/heifdec/linux_*.gz
          ls -l internal/gallery/heifdec
          for f in internal/gallery/heifdec/linux_*.gz; do test -s "$f"; done

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
