<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<title>Schuhkarton – Anmelden</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f3b549'/%3E%3Cstop offset='.55' stop-color='%23ff7a59'/%3E%3Cstop offset='1' stop-color='%23b46bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='12' width='24' height='16' rx='3' fill='url(%23g)'/%3E%3Crect x='2' y='6' width='28' height='8' rx='2.5' fill='url(%23g)'/%3E%3Crect x='2' y='12' width='28' height='2' fill='%23000' opacity='.18'/%3E%3Crect x='12' y='18' width='8' height='4' rx='1.2' fill='%230c0d0f' opacity='.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/theme.js"></script>
<script src="/assets/i18n.js"></script>
</head>
<body class="setup login-page">
<main class="login-wrap">
  <header class="login-head">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3b549"/><stop offset=".55" stop-color="#ff7a59"/><stop offset="1" stop-color="#b46bff"/></linearGradient></defs><rect x="4" y="12" width="24" height="16" rx="3" fill="url(#lg)"/><rect x="2" y="6" width="28" height="8" rx="2.5" fill="url(#lg)"/><rect x="2" y="12" width="28" height="2" fill="#000" opacity=".18"/><rect x="12" y="18" width="8" height="4" rx="1.2" fill="#0c0d0f" opacity=".5"/></svg>
    <h1 id="title">Schuhkarton</h1>
  </header>
  <div class="login-tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="login" class="on" data-t="Anmelden">Anmelden</button>
    <button role="tab" data-tab="register" data-t="Konto anlegen">Konto anlegen</button>
  </div>
  <form class="card" id="form" autocomplete="on">
    <label class="field"><span data-t="Name">Name</span>
      <input id="name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64"></label>
    <label class="field"><span data-t="Passwort">Passwort</span>
      <input id="pw" name="password" type="password" autocomplete="current-password" required></label>
    <label class="field" id="pw2row" hidden><span data-t="Passwort wiederholen">Passwort wiederholen</span>
      <input id="pw2" type="password" autocomplete="new-password"></label>
    <p class="muted small" id="note"></p>
    <p class="msg" id="msg" role="alert"></p>
    <button class="btn primary wide" id="submit" type="submit" data-t="Anmelden">Anmelden</button>
  </form>
  <p class="login-alt" id="alt"></p>
  <p class="login-lang"><button class="btn ghost" id="lang"></button></p>
</main>
<script src="/assets/login.js"></script>
</body>
</html>
