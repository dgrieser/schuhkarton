<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<title>Schuhkarton einrichten</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/i18n.js"></script>
<script src="/assets/theme.js"></script>
</head>
<body class="setup">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.4"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4.5M12 17.4v.1"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
</svg>
<div class="setup-wrap">
  <header class="setup-head">
    <img class="logo" src="/assets/logo.svg" alt="">
    <div><h1 id="title" data-t="Schuhkarton einrichten">Schuhkarton einrichten</h1><p class="muted" id="subtitle" data-t="In wenigen Schritten zur eigenen Fotogalerie.">In wenigen Schritten zur eigenen Fotogalerie.</p></div>
    <a class="btn ghost" id="back" href="/" hidden data-t="Zur Galerie">Zur Galerie</a>
  </header>
  <nav class="steps" id="steps"></nav>
  <main id="step"></main>
  <footer class="setup-foot">
    <button class="btn" id="prev" data-t="Zurück">Zurück</button>
    <span class="grow muted" id="hint"></span>
    <button class="btn primary" id="next" data-t="Weiter">Weiter</button>
  </footer>
</div>
<div class="modal" id="picker" hidden>
  <div class="modal-box">
    <header><b data-t="Ordner wählen">Ordner wählen</b><button class="btn ghost icon" data-close><svg class="i"><use href="#i-x"/></svg></button></header>
    <div class="pick-path"><button class="btn icon" id="pickUp" title="Übergeordneter Ordner" data-t-title="Übergeordneter Ordner"><svg class="i"><use href="#i-up"/></svg></button><input id="pickInput" spellcheck="false"></div>
    <div class="pick-roots" id="pickRoots"></div>
    <div class="pick-list" id="pickList"></div>
    <footer><span class="muted" id="pickInfo"></span><button class="btn primary" id="pickOk" data-t="Diesen Ordner nehmen">Diesen Ordner nehmen</button></footer>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/assets/setup.js"></script>
</body>
</html>
