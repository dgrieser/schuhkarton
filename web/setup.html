<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<title>Schuhkarton einrichten</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f3b549'/%3E%3Cstop offset='.55' stop-color='%23ff7a59'/%3E%3Cstop offset='1' stop-color='%23b46bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='12' width='24' height='16' rx='3' fill='url(%23g)'/%3E%3Crect x='2' y='6' width='28' height='8' rx='2.5' fill='url(%23g)'/%3E%3Crect x='2' y='12' width='28' height='2' fill='%23000' opacity='.18'/%3E%3Crect x='12' y='18' width='8' height='4' rx='1.2' fill='%230c0d0f' opacity='.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/app.css">
<script>
  (function () {
    var t = 'system';
    try { t = localStorage.getItem('schuhkarton-theme') || 'system'; } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body class="setup">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"/><path d="M12 10v4.5M12 17.4v.1"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="m5 15 7-7 7 7"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
</svg>
<div class="setup-wrap">
  <header class="setup-head">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3b549"/><stop offset=".55" stop-color="#ff7a59"/><stop offset="1" stop-color="#b46bff"/></linearGradient></defs><rect x="4" y="12" width="24" height="16" rx="3" fill="url(#lg)"/><rect x="2" y="6" width="28" height="8" rx="2.5" fill="url(#lg)"/><rect x="2" y="12" width="28" height="2" fill="#000" opacity=".18"/><rect x="12" y="18" width="8" height="4" rx="1.2" fill="#0c0d0f" opacity=".5"/></svg>
    <div><h1 id="title">Schuhkarton einrichten</h1><p class="muted" id="subtitle">In wenigen Schritten zur eigenen Fotogalerie.</p></div>
    <a class="btn ghost" id="back" href="/" hidden>Zur Galerie</a>
  </header>
  <nav class="steps" id="steps"></nav>
  <main id="step"></main>
  <footer class="setup-foot">
    <button class="btn" id="prev">Zurück</button>
    <span class="grow muted" id="hint"></span>
    <button class="btn primary" id="next">Weiter</button>
  </footer>
</div>
<div class="modal" id="picker" hidden>
  <div class="modal-box">
    <header><b>Ordner wählen</b><button class="btn ghost icon" data-close><svg class="i"><use href="#i-x"/></svg></button></header>
    <div class="pick-path"><button class="btn icon" id="pickUp" title="Übergeordneter Ordner"><svg class="i"><use href="#i-up"/></svg></button><input id="pickInput" spellcheck="false"></div>
    <div class="pick-roots" id="pickRoots"></div>
    <div class="pick-list" id="pickList"></div>
    <footer><span class="muted" id="pickInfo"></span><button class="btn primary" id="pickOk">Diesen Ordner nehmen</button></footer>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/assets/setup.js"></script>
</body>
</html>
