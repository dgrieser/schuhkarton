  <defs>
    <linearGradient id="sk-lidTop" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#8df6eb"/><stop offset="1" stop-color="#9bf9ee"/></linearGradient>
    <linearGradient id="sk-lidInside" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#7591ed"/><stop offset="1" stop-color="#8b9bf8"/></linearGradient>
    <linearGradient id="sk-rim" x1="0" y1="0" x2="0.7" y2="1"><stop stop-color="#8dd1f0"/><stop offset="1" stop-color="#7abaf0"/></linearGradient>
    <linearGradient id="sk-box" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b3f1fa"/><stop offset="0.5" stop-color="#a5edf7"/><stop offset="1" stop-color="#c1f3f7"/></linearGradient>
    <linearGradient id="sk-slot" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#078e9e"/><stop offset="1" stop-color="#0798a9"/></linearGradient>
    <linearGradient id="sk-sky" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#48dcca"/><stop offset="1" stop-color="#5bdccc"/></linearGradient>
    <linearGradient id="sk-mountains" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#329be8"/><stop offset="1" stop-color="#568eef"/></linearGradient>
    <linearGradient id="sk-heartBg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c4a6f2"/><stop offset="1" stop-color="#b78ae9"/></linearGradient>
    <clipPath id="sk-scene"><rect x="429" y="405" width="238" height="260" rx="19"/></clipPath>
    <clipPath id="sk-inbox"><rect x="260" y="155" width="720" height="640"/></clipPath>
  </defs>
  <style>
    .p1, .p2, .star, .rays { transform-box: fill-box; transform-origin: center; animation: 3.2s infinite both; }
    .p1 { animation-name: sk-p1; }
    .p2 { animation-name: sk-p2; }
    .star { animation-name: sk-star; }
    .rays { animation-name: sk-rays; }
    .lid-still { display: none; }
    @keyframes sk-p1 {
      0%, 9% { transform: translateY(260px); animation-timing-function: cubic-bezier(.2, .8, .3, 1.2); }
      21%, 36% { transform: none; animation-timing-function: ease-in; }
      56%, 100% { transform: translateY(260px); }
    }
    @keyframes sk-p2 {
      0%, 11% { transform: translateY(240px); animation-timing-function: cubic-bezier(.2, .8, .3, 1.25); }
      24%, 33% { transform: none; animation-timing-function: ease-in; }
      53%, 100% { transform: translateY(240px); }
    }
    @keyframes sk-star {
      0%, 17% { transform: scale(0) rotate(-90deg); opacity: 0; animation-timing-function: cubic-bezier(.2, .8, .3, 1.4); }
      26%, 34% { transform: none; opacity: 1; }
      44%, 100% { transform: scale(0) rotate(45deg); opacity: 0; }
    }
    @keyframes sk-rays {
      0%, 22% { transform: scale(.2); opacity: 0; animation-timing-function: ease-out; }
      29%, 34% { transform: none; opacity: 1; }
      42%, 100% { transform: scale(.2); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .star, .rays { animation: none; }
      .lid-move { display: none; }
      .lid-still { display: inline; }
    }
  </style>
